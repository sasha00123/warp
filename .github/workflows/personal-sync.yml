name: Personal upstream sync
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository_owner == 'sasha00123' && github.ref == 'refs/heads/personal/main'
    environment: upstream-sync
    runs-on: ubuntu-latest
    steps:
      - name: Require the scoped sync credential
        env:
          SYNC_SSH_KEY: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
        run: |
          if [[ -z "$SYNC_SSH_KEY" ]]; then
            echo 'Configure UPSTREAM_SYNC_SSH_KEY in the protected upstream-sync environment.' >&2
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
          ref: personal/main
          fetch-depth: 0
      - run: bash distribution/sync-upstream.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
