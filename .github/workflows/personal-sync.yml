name: Personal upstream sync
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository_owner == 'sasha00123' && github.ref == 'refs/heads/personal/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: personal/main
          fetch-depth: 0
      - run: bash distribution/sync-upstream.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
