name: Personal macOS build
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: macOS (${{ matrix.arch }})
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_LTO_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO_LTO: 'false'
      CARGO_PROFILE_RELEASE_LTO_CODEGEN_UNITS: '16'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          submodules: recursive
          lfs: true
      - name: Check distribution safeguards
        run: python3 distribution/verify.py
      - name: Install build tools
        run: bash distribution/setup-macos.sh
      - name: Core identity and path tests
        run: cargo test --locked -p warp_core --lib
      - name: Build and package
        env:
          PERSONAL_VERSION: ${{ inputs.version }}
        run: bash distribution/build-macos.sh "$PERSONAL_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: personal-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
