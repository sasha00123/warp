name: Personal CI
on:
  pull_request:
    branches: [personal/main]
  push:
    branches: [personal/main, feature/distribution-pipeline]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional PR merge ref, e.g. refs/pull/12/merge'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: personal-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - run: python3 distribution/verify.py
      - run: python3 -m unittest discover -s distribution -p 'test_*.py'
      - run: bash -n distribution/*.sh
  build:
    needs: validate
    uses: ./.github/workflows/personal-build.yml
    with:
      source_ref: ${{ inputs.source_ref || github.ref }}
      version: 0.0.${{ github.run_number }}
