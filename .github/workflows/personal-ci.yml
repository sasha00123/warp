name: Personal CI
on:
  pull_request:
    branches: [personal/main]
  push:
    branches: [personal/main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional PR merge ref, e.g. refs/pull/12/merge'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: personal-ci-${{ github.event.pull_request.number || inputs.source_ref || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    outputs:
      build_sha: ${{ steps.revision.outputs.build_sha }}
      status_sha: ${{ steps.revision.outputs.status_sha }}
      base_sha: ${{ steps.revision.outputs.base_sha }}
      pr_number: ${{ steps.revision.outputs.pr_number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 2
      - name: Pin source and status commits
        id: revision
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "$SOURCE_REF" && ! "$SOURCE_REF" =~ ^refs/pull/[0-9]+/merge$ ]]; then
            echo 'source_ref must be empty or refs/pull/NUMBER/merge' >&2
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          echo "build_sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ -n "$SOURCE_REF" ]]; then
            PR_NUMBER=${SOURCE_REF#refs/pull/}
            PR_NUMBER=${PR_NUMBER%/merge}
          fi
          if [[ -n "$PR_NUMBER" ]]; then
            # GitHub can regenerate a test-merge SHA without changing either parent.
            # Report the tested integration result on the stable PR head instead.
            echo "status_sha=$(git rev-parse HEAD^2)" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "status_sha=$sha" >> "$GITHUB_OUTPUT"
          fi
      - run: python3 distribution/verify.py
      - run: python3 -m unittest discover -s distribution -p 'test_*.py'
      - run: bash -n distribution/*.sh
  build:
    needs: validate
    uses: ./.github/workflows/personal-build.yml
    with:
      source_ref: ${{ needs.validate.outputs.build_sha }}
      version: 0.0.${{ github.run_number }}
  status:
    name: Report personal CI
    needs: [validate, build]
    if: always() && needs.validate.outputs.status_sha != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - name: Report the tested integration result on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS_SHA: ${{ needs.validate.outputs.status_sha }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [[ "$VALIDATE_RESULT" == success && "$BUILD_RESULT" == success ]]; then state=success; fi
          if [[ -n "$PR_NUMBER" ]]; then
            read -r current_head current_base < <(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '[.head.sha, .base.sha] | join(" ")')
            if [[ "$current_head" != "$STATUS_SHA" || "$current_base" != "$BASE_SHA" ]]; then
              state=failure
              echo 'PR changed during the build; rerun against its current merge ref.' >&2
            fi
          fi
          gh api "repos/$GH_REPO/statuses/$STATUS_SHA" -f state="$state" -f context='personal/ci' -f target_url="$RUN_URL" -f description='Validation and both macOS builds'
