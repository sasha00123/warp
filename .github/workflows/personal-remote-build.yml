name: Personal Linux SSH extension build
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_LTO_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO_LTO: 'false'
      CARGO_PROFILE_RELEASE_LTO_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          submodules: recursive
          lfs: true
      - run: bash distribution/setup-linux.sh
      - name: Persistent workspace regression tests
        run: cargo test --locked --manifest-path tools/persistent-ssh-lab/rpc-harness/Cargo.toml -- --include-ignored --test-threads=1
      - name: Package matching remote extension
        env:
          PERSONAL_VERSION: ${{ inputs.version }}
        run: bash distribution/build-remote.sh "$PERSONAL_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: personal-remote-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
